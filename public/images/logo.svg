<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Los colores van como atributos: si el navegador no aplica el <style>
       (Firefox es irregular con CSS dentro de un favicon), igual se ve bien en
       claro. El CSS solo invierte para modo oscuro, y pisa al atributo porque
       cualquier regla tiene mas peso que una presentation attribute. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tinta { fill: #EDEFEB }
      .papel { fill: #11171A }
    }
  </style>
  <rect class="tinta" fill="#11171A" x="2" y="2" width="20" height="20" rx="4.6"/>
  <rect class="papel" fill="#EDEFEB" x="6.5"  y="6"     width="1.7" height="12"  rx=".85"/>
  <rect class="papel" fill="#EDEFEB" x="10.6" y="7.3"   width="6.9" height="1.8" rx=".9"/>
  <rect class="papel" fill="#EDEFEB" x="10.6" y="11.1"  width="6.9" height="1.8" rx=".9"/>
  <rect class="papel" fill="#EDEFEB" x="10.6" y="14.9"  width="3.9" height="1.8" rx=".9"/>
</svg>
